name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: pgvector/pgvector:0.8.7-pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_dev
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      RELAY_TEST_DATABASE_URL: postgresql+psycopg://relay_app:relay_app_dev@localhost:5432/relay_test
      RELAY_TEST_MIGRATION_DATABASE_URL: postgresql+psycopg://relay_owner:relay_owner_dev@localhost:5432/relay_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - name: Provision database roles (same script as docker compose)
        run: psql "postgresql://postgres:postgres_dev@localhost:5432/postgres" -v ON_ERROR_STOP=1 -f ../infra/db/init/01-roles.sql
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest
      - name: Migrations round-trip (upgrade, downgrade to base, upgrade)
        env:
          RELAY_MIGRATION_DATABASE_URL: postgresql+psycopg://relay_owner:relay_owner_dev@localhost:5432/relay
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build backend image
        run: docker build -t relay-backend:ci backend
      - name: Build web image
        run: docker build -t relay-web:ci --build-arg NEXT_PUBLIC_WORKOS_REDIRECT_URI=https://ci.example.com/callback frontend
      # Supply chain: an SBOM per image, and the build fails on fixable critical/high CVEs.
      - name: SBOM (backend image)
        uses: anchore/sbom-action@v0
        with:
          image: relay-backend:ci
          format: spdx-json
          output-file: sbom-backend.spdx.json
      - name: SBOM (web image)
        uses: anchore/sbom-action@v0
        with:
          image: relay-web:ci
          format: spdx-json
          output-file: sbom-web.spdx.json
      - name: Vulnerability scan (backend image)
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: relay-backend:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Vulnerability scan (web image)
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: relay-web:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  licences:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # CLAUDE.md guardrail 10: no AGPL/GPL/SSPL/BSL/SUL production dependencies.
      - name: Backend licences
        working-directory: backend
        run: |
          uv sync --locked --no-dev
          uv run --with pip-licenses pip-licenses --from=mixed \
            --fail-on="GNU Affero General Public License v3 (AGPLv3);GNU General Public License v3 (GPLv3);GNU General Public License v2 (GPLv2);Server Side Public License (SSPL);Business Source License 1.1"
      - name: Web licences
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile --prod
          npx --yes license-checker-rseidelsohn --production --summary \
            --failOn "AGPL-3.0;AGPL-3.0-only;AGPL-3.0-or-later;GPL-2.0;GPL-3.0;SSPL-1.0;BUSL-1.1"
