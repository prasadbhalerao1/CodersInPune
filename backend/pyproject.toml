[project]
name = "relay"
version = "0.1.0"
description = "Relay backend: organisational continuity platform API and workers"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.2",
    "httpx>=0.28.1",
    "procrastinate==3.10.0",
    "psycopg[binary]>=3.3.8",
    "pydantic-settings>=2.16.2",
    "pyjwt[crypto]>=2.15.1",
    "pyyaml>=6",
    "sqlalchemy[asyncio]>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
relay-api = "relay.__main__:main"
relay-worker = "relay.worker:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
    "types-pyyaml>=6.0.12.20261103",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF", "SIM", "PT"]
ignore = ["S101", "RUF012"] # assert in tests; RUF012 flags SQLAlchemy __table_args__

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]  # dev-only credentials in test defaults
"migrations/**" = ["S608"]     # DDL composed from validated identifiers

[tool.mypy]
strict = true
python_version = "3.14"
mypy_path = "src"
packages = ["relay", "tests"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error"]
